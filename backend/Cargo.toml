[package]
name = "huppy-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = { version = "0.5.3", features = ["rand"] }
# argon2 0.5.3 requires password-hash ^0.5 — the two are one matched pair,
# and their PasswordVerifier trait differs between 0.5 and 0.6, so bumping
# only one of them breaks the build.
password-hash = { version = "0.6.1", features = ["getrandom"] }
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.3.12", features = ["postgres", "r2d2", "uuid", "chrono", "serde_json"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
dotenvy = "0.15"
# jsonwebtoken 11 needs an explicit crypto backend (its default features only
# pull in PEM parsing); `rust_crypto` is the pure-Rust provider — everything
# this app signs is HS256, which it covers.
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
r2d2 = "0.8.10"
rand = "0.8.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
sha2 = "0.10.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
# Lets integration tests drive the axum Router in-process (ServiceExt::oneshot).
tower = { version = "0.5", features = ["util"] }
